# Netlify deploys the static site from /site (no build step).
[build]
  publish = "site"
  command = ""

# Security headers for every page and file.
# - frame-ancestors / X-Frame-Options: the site cannot be embedded in another
#   site (stops clickjacking, e.g. a fake page overlaying the donate form).
# - nosniff: browsers must trust the declared file type.
# - Referrer-Policy: other sites only see "brialendowment.org", never full URLs.
# - Permissions-Policy: no camera / microphone / location access for any script.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"

# Serve the PWA manifest with its proper type (required now that nosniff is on).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
