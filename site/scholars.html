<style>/* ============================================================
   BRIAL — MOTION & VISUAL EFFECTS LAYER · GEN 3 "MAXIMUM"
   Premium motion design over the existing React app.
   Applied at runtime by motion-effects.js:
     .fx-btn        small interactive controls
     .fx-gold       solid-gold CTAs (shine sweep + halo + magnetic)
     .fx-idle       gold CTAs that breathe an idle shine when visible
     .fx-card       large clickable cards (tilt + spotlight + glare)
     .fx-glowcard   non-interactive framed cards (cursor spotlight)
     .fx-pre/.fx-in scroll-reveal states (variants via data-fxv)
     .fx-pre-img    image wipe reveal
     .fx-view-in    view-mount transition
     #fx-progress   reading progress hairline
     .fx-aurora     ambient hero light field
     #fx-dust       gold dust particle canvas
   All motion is gated behind prefers-reduced-motion.
   ============================================================ */

@media (prefers-reduced-motion: no-preference) {

  /* ---------- 0. Scroll progress hairline ---------- */
  #fx-progress {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 2px;
    z-index: 240;
    pointer-events: none;
    background: linear-gradient(90deg, #C9A961 0%, #E3C98A 55%, #4FD1C5 100%);
    box-shadow: 0 0 12px rgba(201, 169, 97, 0.55);
    transform-origin: 0 50%;
    transform: scaleX(0);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #fx-progress.fx-on { opacity: 1; }

  /* ---------- 1. Ambient hero atmosphere ---------- */
  .fx-aurora {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  .fx-aurora i {
    position: absolute;
    display: block;
    border-radius: 50%;
    filter: blur(60px);
    mix-blend-mode: screen;
    will-change: transform;
  }
  .fx-aurora i:nth-child(1) {
    width: 56vw; height: 56vw;
    left: -12vw; top: -18vw;
    background: radial-gradient(circle, rgba(201, 169, 97, 0.16) 0%, rgba(201, 169, 97, 0.05) 45%, transparent 70%);
    animation: fxAurora1 26s ease-in-out infinite alternate;
  }
  .fx-aurora i:nth-child(2) {
    width: 44vw; height: 44vw;
    right: -10vw; top: 8vw;
    background: radial-gradient(circle, rgba(79, 209, 197, 0.10) 0%, rgba(79, 209, 197, 0.03) 45%, transparent 70%);
    animation: fxAurora2 34s ease-in-out infinite alternate;
  }
  .fx-aurora i:nth-child(3) {
    width: 38vw; height: 38vw;
    left: 28vw; bottom: -20vw;
    background: radial-gradient(circle, rgba(184, 150, 81, 0.12) 0%, transparent 65%);
    animation: fxAurora1 40s ease-in-out infinite alternate-reverse;
  }
  @keyframes fxAurora1 {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(9vw, 6vh, 0) scale(1.18); }
  }
  @keyframes fxAurora2 {
    from { transform: translate3d(0, 0, 0) scale(1.1); }
    to   { transform: translate3d(-8vw, -5vh, 0) scale(0.94); }
  }

  #fx-dust {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* ---------- 2. Buttons: lift, glow, press ---------- */
  .fx-btn {
    transition:
      transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.32s cubic-bezier(0.22, 1, 0.36, 1),
      filter 0.32s ease;
    will-change: transform;
  }
  .fx-btn:hover:not(:disabled) {
    transform: translateY(-1.5px);
    box-shadow:
      0 6px 22px rgba(0, 0, 0, 0.28),
      0 0 14px rgba(201, 169, 97, 0.18);
  }
  .fx-btn:active:not(:disabled) {
    transform: translateY(0) scale(0.97);
    transition-duration: 0.08s;
  }

  /* ---------- 3. Gold CTAs: shine sweep + halo + idle breath ---------- */
  .fx-gold {
    position: relative;
    overflow: hidden;
  }
  .fx-gold::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -80%;
    width: 55%;
    background: linear-gradient(
      100deg,
      transparent 8%,
      rgba(255, 255, 255, 0.45) 50%,
      transparent 92%
    );
    transform: skewX(-22deg);
    opacity: 0;
    pointer-events: none;
  }
  .fx-gold:hover:not(:disabled) {
    box-shadow:
      0 6px 26px rgba(0, 0, 0, 0.3),
      0 0 26px rgba(201, 169, 97, 0.42),
      0 0 60px rgba(201, 169, 97, 0.15);
  }
  .fx-gold:hover:not(:disabled)::after {
    animation: fxShine 0.85s cubic-bezier(0.35, 0, 0.25, 1) forwards;
  }
  @keyframes fxShine {
    0%   { left: -80%; opacity: 0; }
    12%  { opacity: 1; }
    100% { left: 130%; opacity: 0; }
  }
  /* idle shine: a quiet sweep every ~7s while the CTA is on screen */
  .fx-idle.fx-idle-on:not(:hover)::after {
    animation: fxIdleShine 7s cubic-bezier(0.35, 0, 0.25, 1) 2.2s infinite;
  }
  @keyframes fxIdleShine {
    0%    { left: -80%; opacity: 0; }
    1.5%  { opacity: 0.75; }
    13%   { left: 130%; opacity: 0; }
    100%  { left: 130%; opacity: 0; }
  }

  /* ---------- 4. Click ripple ---------- */
  .fx-ripple {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(201, 169, 97, 0.35) 0%,
      rgba(201, 169, 97, 0.12) 45%,
      transparent 70%);
    transform: scale(0);
    animation: fxRipple 0.65s cubic-bezier(0.2, 0.6, 0.35, 1) forwards;
    z-index: 3;
  }
  @keyframes fxRipple {

        rgba(201, 169, 97, 0.05) 35%,
        transparent 65%

  .fx-card::after, .fx-glowcard::after {

    position: absolute;
    inset: 0;
    pointer-events: none;
    border: 1px solid transparent;
    background:
      radial-gradient(300px circle at var(--fx-x, 50%) var(--fx-y, 50%),
